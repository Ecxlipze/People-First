f<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merchanity — Coming Soon</title>
<meta name="description" content="Pakistan's Next Trusted Marketplace. Where Businesses Grow &amp; Customers Discover.">

<meta property="og:type" content="website">
<meta property="og:title" content="Merchanity — Coming Soon">
<meta property="og:description" content="Pakistan's Next Trusted Marketplace. Where Businesses Grow &amp; Customers Discover.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23f4762a'/%3E%3Cpath d='M32 68 L68 32 M46 32 h22 v22' stroke='%23fff' stroke-width='11' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#12233f;
  --navy-2:#1b2f4e;
  --orange:#f4762a;
  --orange-2:#fb8f3d;
  --orange-deep:#e8631b;
  --ink:#6b7280;
  --bg:#f7f7f9;
  --card:#fff;
  --ease:cubic-bezier(.22,1,.36,1);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--navy);
  background:var(--bg);
  min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;
  overflow-x:hidden;position:relative;
  -webkit-font-smoothing:antialiased;
}

/* ---------------- Background ----------------
   The mockup is a near-white page with a few DEFINED soft circles:
   a pale lavender disc off the right edge, a peach/cream disc behind the
   laptop at lower-left, and a faint warm disc upper-left. Keeping them as
   discs (not broad washes) is what matches the comp. */
.bg{position:fixed;inset:0;z-index:-3;background:#fcfcfd}
.bg-blobs{position:fixed;inset:0;z-index:-3;pointer-events:none;overflow:hidden}
.bg-blobs i{position:absolute;display:block;border-radius:50%}
/* pale lavender disc, right side — largest shape in the comp.
   Feathered over a long ramp so the edge never reads as a hard arc. */
.blob-lav{
  width:66vmax;height:66vmax;top:20%;right:-27vmax;
  background:radial-gradient(circle at 45% 42%,
    #eceef9 0%, #eff0fa 40%, rgba(239,240,250,.55) 62%, rgba(239,240,250,0) 82%);
  filter:blur(14px);
}
/* lavender wash upper-right corner */
.blob-lav2{
  width:40vmax;height:40vmax;top:-17vmax;right:-11vmax;
  background:radial-gradient(circle at 50% 55%, #ecedf8 0%, rgba(236,237,248,0) 70%);
}
/* peach / cream disc behind the laptop, lower-left */
.blob-peach{
  width:58vmax;height:58vmax;bottom:-25vmax;left:-18vmax;
  background:radial-gradient(circle at 55% 44%,
    #fdf2ea 0%, #fcf0e6 48%, rgba(252,240,230,.5) 66%, rgba(252,240,230,0) 84%);
  filter:blur(12px);
}
/* faint warm disc upper-left, behind the leaf */
.blob-warm{
  width:34vmax;height:34vmax;top:-13vmax;left:-9vmax;
  background:radial-gradient(circle at 55% 60%, #f4efe9 0%, rgba(244,239,233,0) 70%);
}

/* faint leaf, top-left */
.leaf{position:fixed;top:-7%;left:-5%;width:clamp(190px,24vw,360px);z-index:-2;
  opacity:.42;pointer-events:none}
.leaf .blade{fill:#efedea}
.leaf .vein{fill:none;stroke:#e8e5e1;stroke-width:1.2}

/* dotted grids */
.dots{position:fixed;z-index:-2;pointer-events:none;
  background-image:radial-gradient(#aeb3cd 1.15px, transparent 1.15px);
  background-size:11px 11px;opacity:.72}
.dots-a{top:25.5%;left:5%;width:66px;height:66px}
.dots-b{top:23.5%;right:3.2%;width:154px;height:88px}
@media (max-width:900px){.dots,.leaf{display:none}}

/* ---------------- Layout ---------------- */
.wrap{
  position:relative;z-index:2;
  flex:1;display:flex;flex-direction:column;align-items:center;
  text-align:center;
  width:100%;max-width:1000px;margin:0 auto;
  padding:clamp(24px,4.4vh,52px) 20px clamp(18px,3vh,32px);
}

/* ---------------- Logo ---------------- */
.logo-block{display:flex;flex-direction:column;align-items:center}
.logo{width:clamp(206px,27vw,330px);height:auto;display:block}

/* ---------------- Headline ---------------- */
.eyebrow{
  margin:clamp(20px,3.8vh,40px) 0 0;
  font-size:clamp(12px,1.45vw,19px);
  font-weight:400;letter-spacing:.42em;text-indent:.42em;
  color:#3d4759;text-transform:uppercase;
}
.headline{
  margin:clamp(2px,.8vh,10px) 0 0;
  font-size:clamp(46px,9.6vw,116px);
  font-weight:700;line-height:.96;letter-spacing:-.012em;
  text-transform:uppercase;white-space:nowrap;
}
/* Narrow screens: 9.6vw is still too wide for one line at 390px, and the
   46px floor overflows. Drop the floor and let it track the viewport. */
@media (max-width:560px){
  .headline{font-size:min(13.2vw,58px)}
  .eyebrow{font-size:min(3.4vw,15px)}
}
.headline .soon{color:var(--orange)}

/* ---------------- Divider with arrow ---------------- */
.divider{
  display:flex;align-items:center;justify-content:center;
  gap:clamp(10px,1.6vw,20px);
  margin:clamp(16px,2.6vh,26px) 0 0;
  width:100%;max-width:clamp(300px,44vw,520px);
}
.divider .rule{flex:1;height:2px;background:var(--orange);opacity:.92;border-radius:2px}
.divider .mark{flex:none;width:clamp(22px,2.5vw,32px);height:auto;display:block}

/* ---------------- Sub copy ---------------- */
.lede{
  margin:clamp(14px,2.4vh,22px) 0 0;
  font-size:clamp(18px,2.7vw,33px);
  font-weight:700;line-height:1.25;color:var(--navy);
  max-width:100%;
}
.sub{
  margin:clamp(5px,.9vh,10px) 0 0;
  font-size:clamp(14px,1.85vw,22px);
  font-weight:400;color:#3f4a5c;
}

/* ---------------- CTA ---------------- */
.cta-zone{margin:clamp(26px,4.6vh,50px) 0 0;width:100%;max-width:430px}
.notify{
  display:inline-flex;align-items:center;justify-content:center;gap:11px;
  font:inherit;cursor:pointer;
  font-size:clamp(14px,1.55vw,19px);font-weight:600;letter-spacing:.055em;
  text-transform:uppercase;color:#fff;
  padding:clamp(14px,1.8vw,20px) clamp(34px,5vw,64px);
  border:0;border-radius:999px;
  background:linear-gradient(100deg,var(--orange-deep) 0%,var(--orange) 46%,var(--orange-2) 100%);
  box-shadow:0 10px 26px rgba(244,118,42,.36), 0 2px 5px rgba(244,118,42,.24);
  transition:transform .2s var(--ease), box-shadow .22s var(--ease), filter .2s var(--ease);
}
.notify:hover{transform:translateY(-2px);box-shadow:0 15px 32px rgba(244,118,42,.44);filter:saturate(1.06)}
.notify:active{transform:translateY(0)}
.notify svg{width:1.15em;height:1.15em;fill:currentColor;flex:none}

/* email form (revealed by NOTIFY ME) */
.form-shell{
  margin:clamp(14px,2.2vh,20px) 0 0;
  display:none;
}
.form-shell.open{display:block;animation:pop .42s var(--ease) both}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}to{opacity:1;transform:none}}
form{display:flex;gap:9px;align-items:center}
input[type=email]{
  flex:1;min-width:0;font:inherit;font-size:clamp(13px,1.2vw,15px);
  padding:13px 19px;color:var(--navy);
  border:1px solid #e3e3e8;border-radius:999px;background:#fff;
  box-shadow:0 2px 8px rgba(24,30,60,.05);
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
}
input[type=email]::placeholder{color:#a7a9b4}
input[type=email]:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(244,118,42,.16)}
.go{
  flex:none;font:inherit;cursor:pointer;
  font-size:clamp(12px,1.1vw,13.5px);font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:#fff;
  padding:13px clamp(20px,2.4vw,28px);
  border:0;border-radius:999px;
  background:linear-gradient(100deg,var(--orange-deep),var(--orange-2));
  box-shadow:0 4px 14px rgba(244,118,42,.32);
  transition:transform .18s var(--ease), box-shadow .2s var(--ease);
}
.go:hover{transform:translateY(-1px);box-shadow:0 7px 20px rgba(244,118,42,.4)}
.go:disabled{opacity:.6;cursor:default;transform:none}
.status{font-size:clamp(11.5px,1.1vw,13px);font-weight:500}
.status:empty{display:none}
.status:not(:empty){margin:9px 0 0}
.status[data-state=error]{color:#d14343}
.status[data-state=ok]{color:#12855f}
@media (max-width:560px){
  form{flex-direction:column;align-items:stretch}
  .go{padding:13px 24px}
}

/* ---------------- Floating feature cards ---------------- */
.fcard{
  position:fixed;z-index:3;
  background:var(--card);
  border-radius:14px;
  box-shadow:0 10px 30px rgba(24,30,60,.11), 0 2px 6px rgba(24,30,60,.05);
  padding:15px 17px;
  display:flex;align-items:flex-start;gap:12px;
  width:clamp(196px,17.5vw,226px);
  text-align:left;
  animation:bob 7s var(--ease) infinite alternate;
}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-9px)}}
.fcard .ic{flex:none;width:38px;height:38px;border-radius:50%}
.fcard h3{margin:0;font-size:13.5px;font-weight:600;line-height:1.3;color:var(--navy)}
.fcard p{margin:4px 0 0;font-size:11.5px;line-height:1.42;color:var(--ink);font-weight:400}
.fcard-biz{left:2.6%;top:34%}
.fcard-biz .ic{background:#eceafb}
.fcard-cust{right:2.6%;top:41%;animation-delay:-3.5s}
.fcard-cust .ic{background:#fdeadf}
@media (max-width:1180px){.fcard{width:180px;padding:13px 14px}}
@media (max-width:1000px){.fcard{position:static;animation:none;width:min(320px,90vw);max-width:100%;margin:0 auto}}

/* ---------------- Laptop (bottom-left) ---------------- */
.laptop{
  position:fixed;left:0;bottom:0;z-index:1;
  width:clamp(320px,39vw,520px);
  pointer-events:none;
  transform:translateX(-4%);
}
/* ---------------- Bags + parcels (bottom-right) ---------------- */
.goods{
  position:fixed;right:0;bottom:0;z-index:1;
  width:clamp(300px,36vw,470px);
  pointer-events:none;
}
@media (max-width:1000px){.laptop,.goods{position:static;transform:none;width:min(430px,88vw);max-width:100%;margin:0 auto;height:auto}}

/* mobile stack area */
.mobile-extras{display:none}
@media (max-width:1000px){
  .mobile-extras{display:flex;flex-direction:column;gap:18px;width:100%;
    margin:clamp(28px,4vh,40px) 0 0;align-items:center}
  .mobile-art{display:flex;gap:14px;align-items:flex-end;justify-content:center;width:100%;
    max-width:620px;flex-wrap:wrap}
  .mobile-art > *{flex:1 1 260px;min-width:0;max-width:100%;width:auto}
  .cards-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%}
}

/* ---------------- Reveal ---------------- */
.reveal{opacity:0;transform:translateY(14px);animation:rise .72s var(--ease) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}
.d4{animation-delay:.35s}.d5{animation-delay:.45s}.d6{animation-delay:.55s}

a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--orange);outline-offset:3px}

@media (prefers-reduced-motion:reduce){
  .reveal{animation:none;opacity:1;transform:none}
  .fcard{animation:none}
  *{transition-duration:.01ms !important}
}

@media (max-height:720px) and (min-width:1001px){
  .eyebrow{margin-top:20px}
  .divider{margin-top:12px}
  .cta-zone{margin-top:22px}
}
</style>
</head>

</div>

</aside>

<!-- ============ Bag / plant / parcels ============ -->
<svg class="goods" id="art-goods" viewBox="0 0 480 400" aria-hidden="true">
  <defs>
    <linearGradient id="bagFront" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e3c8a4"/><stop offset=".72" stop-color="#dcbf98"/><stop offset="1" stop-color="#cfae83"/>

  <h1 class="headline reveal d2">Coming <span class="soon">Soon</span></h1>

  <div class="divider reveal d3" aria-hidden="true">
    <span class="rule"></span>
    <svg class="mark" viewBox="0 0 52 56">
      <path d="M6 50 L44 8" fill="none" stroke="#f4762a" stroke-width="11" stroke-linecap="round"/>
      <path d="M22 6 h24 v24" fill="none" stroke="#f4762a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M6 50 L26 26 L40 10 v20 z" fill="#12233f"/>
    </svg>
    <span class="rule"></span>
  </div>

  <p class="lede reveal d3">Pakistan’s Next Trusted Marketplace</p>
  <p class="sub reveal d4">Where Businesses Grow &amp; Customers Discover</p>

  <div class="cta-zone reveal d5">
    <button class="notify" id="notifyBtn" type="button" aria-expanded="false" aria-controls="formShell">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 002.45-2h-4.9A2.5 2.5 0 0012 22zm7-6v-5a7 7 0 00-5.5-6.84V3.5a1.5 1.5 0 00-3 0v.66A7 7 0 005 11v5l-1.6 1.6A1 1 0 004.1 19h15.8a1 1 0 00.7-1.4L19 16z"/></svg>
      Notify me
    </button>

    <div class="form-shell" id="formShell">
      <form id="notifyForm" novalidate>
        <label for="email" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Email address</label>
        <input id="email" type="email" name="email" placeholder="Enter your email address" autocomplete="email" required>
        <button class="go" type="submit">Join</button>
      </form>
      <p class="status" id="status" data-state="" role="status" aria-live="polite"></p>
    </div>
  </div>

  <!-- mobile: art + cards stack into the flow -->
  <div class="mobile-extras" id="mobileExtras"></div>

</main>

<script>
(function(){
  'use strict';

  /* ---------- NOTIFY ME reveals the email field ---------- */
  var btn   = document.getElementById('notifyBtn');
  var shell = document.getElementById('formShell');
  var input = document.getElementById('email');

  btn.addEventListener('click', function(){
    var open = shell.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) input.focus();
  });

  /* ---------- form handling ---------- */
  var form   = document.getElementById('notifyForm');
  var status = document.getElementById('status');
  var go     = form.querySelector('.go');

  /* ============================================================
     EDIT ME — GOOGLE SHEET ENDPOINT
     Paste the Apps Script Web app URL from SETUP-google-sheet.md.
     Leave '' to validate + show the thank-you without storing anything.
     ============================================================ */
  var SHEET_ENDPOINT = '';

  var SOURCE = 'merchanity';

  function say(msg, state){
    status.textContent = msg;
    status.setAttribute('data-state', state || '');
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();                 // always handled in JS now
    var value = input.value.trim();

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)){
      say('Please enter a valid email address.', 'error');
      input.focus();
      return;
    }

    // No endpoint configured yet → confirm without storing.
    if (!SHEET_ENDPOINT){
      go.disabled = true;
      say('Thanks! We\u2019ll let you know the moment we launch.', 'ok');
      input.value = '';
      return;
    }

    go.disabled = true;
    say('Subscribing\u2026', '');

    // Apps Script doesn't send CORS headers, so the response is opaque:
    // no-cors + URLSearchParams (a "simple" request, no preflight).
    var body = new URLSearchParams();
    body.append('email', value);
    body.append('source', SOURCE);

    fetch(SHEET_ENDPOINT, { method:'POST', mode:'no-cors', body:body })
      .then(function(){
        // Opaque response: reaching here means the request was sent.
        say('Thanks! We\u2019ll let you know the moment we launch.', 'ok');
        input.value = '';
        input.disabled = true;
      })
      .catch(function(){
        // Network/offline — let them retry rather than losing the address.
        go.disabled = false;
        say('Something went wrong. Please try again.', 'error');
      });
  });

  input.addEventListener('input', function(){
    if (status.getAttribute('data-state') === 'error') say('', '');
  });

  /* ---------- responsive: move fixed art into the flow on small screens ---------- */
  var mq = window.matchMedia('(max-width:1000px)');
  var extras = document.getElementById('mobileExtras');
  var laptop = document.getElementById('art-laptop');
  var goods  = document.getElementById('art-goods');
  var biz    = document.getElementById('card-biz');
  var cust   = document.getElementById('card-cust');
  var built  = false;
  var artRow, cardsRow;

  function apply(){
    if (mq.matches){
      if (!built){
        cardsRow = document.createElement('div');
        cardsRow.className = 'cards-row';
        artRow = document.createElement('div');
        artRow.className = 'mobile-art';
        extras.appendChild(cardsRow);
        extras.appendChild(artRow);
        built = true;
      }
      cardsRow.appendChild(biz);
      cardsRow.appendChild(cust);
      artRow.appendChild(laptop);
      artRow.appendChild(goods);
    } else if (built) {
      document.body.appendChild(biz);
      document.body.appendChild(cust);
      document.body.appendChild(laptop);
      document.body.appendChild(goods);
    }
  }
  apply();
  mq.addEventListener ? mq.addEventListener('change', apply) : mq.addListener(apply);
})();
</script>
