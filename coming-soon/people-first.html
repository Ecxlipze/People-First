<style>
/* ============================================================
   EDIT ME — launch date for the countdown.
   ISO 8601 with timezone offset. +05:00 = Pakistan Standard Time.
   ============================================================ */
:root{
  --navy:#12233f;
  --magenta:#b3237a;
  --magenta-2:#c0329b;
  --teal:#2dbe9e;
  --ink:#5c6472;
  --card:#ffffff;
  --radius:16px;
  --ease:cubic-bezier(.22,1,.36,1);
}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  color:var(--navy);
  background:#fdfbfc;
  /* Single-screen page: never scroll. dvh tracks mobile browser chrome. */
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
  position:relative;
  -webkit-font-smoothing:antialiased;
}

/* ---------- Background: teal (top-left) → white → pink (bottom-right) ---------- */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:#fff}
.bg::before,.bg::after{content:'';position:absolute;border-radius:50%;filter:blur(70px)}
.bg::before{
  width:80vmax;height:80vmax;top:-42vmax;left:-34vmax;
  background:radial-gradient(circle at 50% 50%, rgba(45,190,158,.42), rgba(45,190,158,.13) 46%, transparent 68%);
}
.bg::after{
  width:88vmax;height:88vmax;bottom:-48vmax;right:-34vmax;
  background:radial-gradient(circle at 50% 50%, rgba(214,84,168,.42), rgba(214,84,168,.13) 46%, transparent 68%);
}
/* extra soft wash bottom-left + top-right so corners aren't dead white */
.bg-wash{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(60vmax 50vmax at 100% 8%, rgba(199,72,158,.13), transparent 70%),
    radial-gradient(55vmax 45vmax at 0% 100%, rgba(45,190,158,.10), transparent 70%);
}

/* ---------- Flowing wave lines ---------- */
.waves{position:fixed;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none;opacity:.55}
.waves path{fill:none;stroke:#c9b6c6;stroke-width:1;vector-effect:non-scaling-stroke}

/* ---------- 3D shards ---------- */
.shard{position:fixed;z-index:-1;pointer-events:none;will-change:transform;
  animation:float var(--dur,13s) var(--ease) infinite alternate;animation-delay:var(--delay,0s)}
@keyframes float{
  from{transform:translate3d(0,0,0) rotate(var(--rot,0deg))}
  to{transform:translate3d(var(--dx,10px),var(--dy,-18px),0) rotate(calc(var(--rot,0deg) + var(--dr,6deg)))}
}
.s-blue{left:3.2%;top:50%;width:clamp(26px,3.1vw,42px);--rot:-8deg;--dx:8px;--dy:-20px;--dur:14s}
.s-purple{left:12.5%;top:54.5%;width:clamp(12px,1.35vw,18px);--rot:12deg;--dx:-6px;--dy:14px;--dur:11s;--delay:-3s}
.s-teal{right:4.5%;top:37%;width:clamp(28px,3.5vw,48px);--rot:9deg;--dx:-10px;--dy:18px;--dur:15s;--delay:-5s}
.s-red{right:13%;top:59%;width:clamp(12px,1.35vw,18px);--rot:-14deg;--dx:9px;--dy:-12px;--dur:12s;--delay:-2s}
@media (max-width:820px){.s-blue,.s-purple,.s-teal,.s-red{display:none}}

/* ---------- Layout ---------- */
.wrap{
  width:100%;max-width:1180px;
  padding:clamp(14px,3vh,40px) 20px clamp(12px,2.4vh,30px);
  margin:0 auto;
  flex:1;min-height:0;
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;
  gap:clamp(10px,2.2vh,26px);
  text-align:center;
  position:relative;z-index:1;
}
/* the flex gap owns vertical rhythm now — clear the per-element margins */
.wrap > *{margin-top:0}

/* ---------- Logo ---------- */
.logo{width:clamp(214px,29vw,352px);height:auto;display:block}
.logo-block{display:flex;flex-direction:column;align-items:center}

/* ---------- Tagline ---------- */
.tagline{
  margin:0;
  font-size:clamp(16px,2.1vw,27px);
  font-weight:400;line-height:1.4;color:#4a5364;
  max-width:none;
}
/* the design breaks after "way." — keep both halves intact */
.tagline .ln{display:block}
@media (max-width:430px){
  .tagline .ln{display:inline}
  .tagline .ln + .ln::before{content:' '}
}

/* ---------- Headline ---------- */
.eyebrow{
  margin:0;
  font-size:clamp(12px,1.45vw,19px);
  font-weight:400;letter-spacing:.42em;text-indent:.42em;
  color:#3d4759;text-transform:uppercase;
}
.headline{
  margin:0;
  font-size:clamp(46px,9.4vw,112px);
  font-weight:700;line-height:.98;letter-spacing:-.005em;
  text-transform:uppercase;white-space:nowrap;
}
.headline .soon{color:var(--magenta-2)}
.head-group{display:flex;flex-direction:column;align-items:center;gap:clamp(1px,.5vh,6px)}
/* Narrow screens: the 46px floor + nowrap overflows at ~390px. */
@media (max-width:560px){
  .headline{font-size:min(13.2vw,58px)}
  .eyebrow{font-size:min(3.4vw,15px);letter-spacing:.36em;text-indent:.36em}
  .tagline{font-size:min(4.3vw,18px)}
}

/* ---------- Countdown ---------- */
.countdown{
  display:flex;align-items:stretch;justify-content:center;
  gap:clamp(6px,1.1vw,14px);
  margin:0;
}
.unit{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:0 6px 22px rgba(30,20,45,.09), 0 1px 3px rgba(30,20,45,.05);
  padding:clamp(12px,1.7vw,20px) clamp(12px,2.1vw,26px);
  min-width:clamp(74px,9.2vw,108px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.unit b{
  display:block;
  font-size:clamp(28px,4.3vw,50px);
  font-weight:800;line-height:1;
  color:var(--navy);
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
}
.unit span{
  display:block;margin-top:6px;
  font-size:clamp(11px,1.15vw,15px);
  font-weight:400;color:var(--ink);
}
.sep{
  display:flex;flex-direction:column;justify-content:center;gap:9px;
  padding-bottom:clamp(16px,2vw,24px);
}
.sep i{width:4px;height:4px;border-radius:50%;background:var(--magenta);opacity:.75}
@media (max-width:560px){
  .countdown{gap:5px;width:100%}
  .sep{gap:6px;padding-bottom:15px}
  .unit{min-width:0;flex:1 1 0;padding:11px 4px}
  .unit b{font-size:min(7.6vw,32px)}
  .unit span{font-size:min(2.9vw,12px)}
}

/* ---------- Subscribe card ---------- */
.subscribe{
  width:100%;max-width:806px;
  margin:0 auto;
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:0 10px 34px rgba(30,20,45,.10), 0 1px 3px rgba(30,20,45,.05);
  padding:clamp(18px,2.5vw,26px) clamp(18px,2.8vw,30px);
  display:flex;align-items:center;
  gap:clamp(16px,2.4vw,28px);
  text-align:left;
}
.orb{
  flex:none;
  width:clamp(58px,7vw,80px);height:clamp(58px,7vw,80px);
  border-radius:50%;
  background:linear-gradient(150deg,#e59ec6 0%,#c98fcf 52%,#a97fd0 100%);
}
.sub-body{flex:1;min-width:0}
.sub-title{font-size:clamp(15px,1.5vw,19px);font-weight:600;margin:0;color:var(--navy)}
.sub-note{font-size:clamp(12px,1.15vw,14px);color:var(--ink);margin:3px 0 0}

form{display:flex;gap:10px;margin:11px 0 0;align-items:center}
input[type=email]{
  flex:1;min-width:0;
  font:inherit;font-size:clamp(13px,1.2vw,14px);
  padding:11px 17px;
  color:var(--navy);
  border:1px solid #e4e0e6;border-radius:999px;
  background:#fcfbfc;
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
}
input[type=email]::placeholder{color:#a9aab4}
input[type=email]:focus{
  outline:none;border-color:var(--magenta);
  box-shadow:0 0 0 3px rgba(179,35,122,.13);
}
button{
  flex:none;font:inherit;cursor:pointer;
  font-size:clamp(11px,1.05vw,12.5px);font-weight:700;letter-spacing:.075em;
  text-transform:uppercase;color:#fff;
  padding:12px clamp(20px,2.4vw,30px);
  border:0;border-radius:999px;
  background:linear-gradient(90deg,#a21f84 0%,#c22f92 55%,#b3237a 100%);
  box-shadow:0 3px 12px rgba(179,35,122,.30);
  transition:transform .18s var(--ease), box-shadow .2s var(--ease), filter .2s var(--ease);
}
button:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(179,35,122,.38);filter:saturate(1.08)}
button:active{transform:translateY(0)}
button:disabled{cursor:default;opacity:.62;transform:none;box-shadow:none}
.privacy{font-size:clamp(11px,1.05vw,12.5px);color:#8b8f9a;margin:9px 0 0}

/* form status */
.status{font-size:clamp(11.5px,1.1vw,13px);font-weight:500}
/* only take up space once it actually says something */
.status:empty{display:none}
.status:not(:empty){margin:9px 0 0}
.status[data-state=error]{color:#c2185b}
.status[data-state=ok]{color:#128a6e}

@media (max-width:640px){
  .subscribe{flex-direction:column;text-align:center;gap:14px}
  .orb{width:62px;height:62px}
  form{flex-direction:column;align-items:stretch}
  button{padding:13px 24px}
  .privacy,.status{text-align:center}
}

/* ---------- Socials ---------- */
.socials{
  display:flex;align-items:center;justify-content:center;
  gap:clamp(20px,3.1vw,40px);
  margin:0;
  padding-bottom:0;
}
.socials a{
  color:var(--magenta);
  display:grid;place-items:center;
  width:34px;height:34px;border-radius:50%;
  transition:transform .2s var(--ease), color .2s var(--ease), background-color .2s var(--ease);
}
.socials a:hover{transform:translateY(-2px);color:#8d1a64;background:rgba(179,35,122,.09)}
.socials a:focus-visible,input:focus-visible,button:focus-visible{
  outline:2px solid var(--magenta);outline-offset:3px;
}
.socials svg{width:19px;height:19px;fill:currentColor;display:block}

/* ---------- Entrance animation ---------- */
.reveal{opacity:0;transform:translateY(14px);animation:rise .72s var(--ease) forwards}
.reveal:nth-child(1){animation-delay:.04s}
@keyframes rise{to{opacity:1;transform:none}}
.d1{animation-delay:.06s}.d2{animation-delay:.16s}.d3{animation-delay:.26s}
.d4{animation-delay:.36s}.d5{animation-delay:.46s}.d6{animation-delay:.56s}

@media (prefers-reduced-motion:reduce){
  .reveal{animation:none;opacity:1;transform:none}
  .shard{animation:none}
  *{transition-duration:.01ms !important}
}

/* Short viewports: shrink the big pieces so everything still fits unscrolled. */
@media (max-height:760px){
  .logo{width:clamp(190px,22vw,290px)}
  .headline{font-size:min(8.4vw,92px)}
  .tagline{font-size:min(1.85vw,22px)}
  .unit{padding:clamp(8px,1.2vw,14px) clamp(10px,1.7vw,20px)}
  .unit b{font-size:min(3.5vw,40px)}
  .orb{width:clamp(46px,5vw,60px);height:clamp(46px,5vw,60px)}
  .subscribe{padding:clamp(12px,1.8vw,18px) clamp(14px,2.2vw,24px)}
}
@media (max-height:620px){
  .tagline{display:none}
  .headline{font-size:min(7.6vw,80px)}
  .unit b{font-size:min(3vw,34px)}
}
</style>
</head>

<script>
(function(){
  'use strict';

  /* ============================================================
     EDIT ME — LAUNCH DATE
     ISO 8601 with offset. +05:00 = Pakistan Standard Time (PKT).
     Example: '2026-09-01T12:00:00+05:00'
     ============================================================ */
  var LAUNCH = '2026-08-29T12:00:00+05:00';

  var target = new Date(LAUNCH).getTime();
  var el = {
    d: document.getElementById('d'),
    h: document.getElementById('h'),
    m: document.getElementById('m'),
    s: document.getElementById('s')
  };

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function tick(){
    var diff = target - Date.now();
    if (isNaN(target)) { el.d.textContent = el.h.textContent = el.m.textContent = el.s.textContent = '--'; return; }
    if (diff <= 0){
      el.d.textContent = el.h.textContent = el.m.textContent = el.s.textContent = '00';
      clearInterval(timer);
      return;
    }
    var s = Math.floor(diff / 1000);
    el.d.textContent = pad(Math.floor(s / 86400));
    el.h.textContent = pad(Math.floor(s % 86400 / 3600));
    el.m.textContent = pad(Math.floor(s % 3600 / 60));
    el.s.textContent = pad(s % 60);
  }
  tick();
  var timer = setInterval(tick, 1000);

  /* ---------------- Subscribe form ---------------- */
  var form   = document.getElementById('notify');
  var input  = document.getElementById('email');
  var status = document.getElementById('status');
  var btn    = form.querySelector('button');

  /* ============================================================
     EDIT ME — GOOGLE SHEET ENDPOINT
     Paste the Apps Script Web app URL from SETUP-google-sheet.md.
     Leave '' to validate + show the thank-you without storing anything.
     ============================================================ */
  var SHEET_ENDPOINT = '';

  var SOURCE = 'people-first';

  function say(msg, state){
    status.textContent = msg;
    status.setAttribute('data-state', state || '');
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();                 // always handled in JS now
    var value = input.value.trim();

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)){
      say('Please enter a valid email address.', 'error');
      input.focus();
      return;
    }

    // No endpoint configured yet → confirm without storing.
    if (!SHEET_ENDPOINT){
      btn.disabled = true;
      say('Thanks! We\u2019ll let you know the moment we launch.', 'ok');
      input.value = '';
      return;
    }

    btn.disabled = true;
    say('Subscribing\u2026', '');

    // Apps Script doesn't send CORS headers, so the response is opaque:
    // no-cors + URLSearchParams (a "simple" request, no preflight).
    var body = new URLSearchParams();
    body.append('email', value);
    body.append('source', SOURCE);

    fetch(SHEET_ENDPOINT, { method:'POST', mode:'no-cors', body:body })
      .then(function(){
        // Opaque response: reaching here means the request was sent.
        say('Thanks! We\u2019ll let you know the moment we launch.', 'ok');
        input.value = '';
        input.disabled = true;
      })
      .catch(function(){
        // Network/offline — let them retry rather than losing the address.
        btn.disabled = false;
        say('Something went wrong. Please try again.', 'error');
      });
  });

  input.addEventListener('input', function(){
    if (status.getAttribute('data-state') === 'error') say('', '');
  });
})();
</script>
